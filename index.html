<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>12 Beauty Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        input, textarea, select { font-size: 16px !important; } /* 防止 iOS 縮放 */
        ::-webkit-scrollbar { width: 0px; background: transparent; } /* 隱藏滾動條更美觀 */
    </style>
</head>
<body class="bg-[#fdf2f4] text-gray-700 selection:bg-rose-200">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        // --- 核心與圖示庫 ---
        import React, { useState, useEffect, useMemo, useRef } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
            Plus, Calendar as CalendarIcon, Search, User, Phone, Eye, Scissors, DollarSign, Trash2, 
            CreditCard, Gift, X, ChevronLeft, ChevronRight, Clock, CheckCircle, XCircle, CalendarClock, 
            Check, AlertTriangle, Loader2, Coins, Settings, Download, Upload, Edit2 
        } from 'https://esm.sh/lucide-react@0.263.1';
        
        // --- Firebase (資料庫) ---
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, writeBatch } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // ==========================================
        // ⬇️ 請在此處貼上您的 Firebase 設定 ⬇️
        // ==========================================
        const firebaseConfig = {
            apiKey: "您的_API_KEY",
            authDomain: "您的專案ID.firebaseapp.com",
            projectId: "您的專案ID",
            storageBucket: "您的專案ID.appspot.com",
            messagingSenderId: "您的_SENDER_ID",
            appId: "您的_APP_ID"
        };
        // ==========================================

        let app, auth, db;
        let isConfigured = false;
        try {
            if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "您的_API_KEY") {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                isConfigured = true;
            }
        } catch (e) { console.error(e); }

        const appId = "12-beauty-studio-v1"; // 資料庫識別碼

        // --- 主題色 (乾燥玫瑰) ---
        const THEME = {
            primary: "bg-[#bc6c7e] hover:bg-[#a85e6f] text-white",
            primaryLight: "bg-[#f4e3e6]",
            textPrimary: "text-[#8a4a58]",
            textSecondary: "text-[#bc6c7e]",
            bg: "bg-[#fdf2f4]",
        };

        const STATUS = [
            { id: 'booked', label: '預約中', color: 'bg-blue-50 text-blue-600', icon: CalendarClock },
            { id: 'normal', label: '已完成', color: 'bg-emerald-50 text-emerald-600', icon: CheckCircle },
            { id: 'late', label: '遲到', color: 'bg-amber-50 text-amber-600', icon: Clock },
            { id: 'noshow', label: '放鳥', color: 'bg-stone-100 text-stone-500', icon: XCircle },
        ];

        // --- 主程式 ---
        function App() {
            if (!isConfigured) return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center text-[#8a4a58]">
                    <AlertTriangle size={48} className="mb-4 text-rose-300" />
                    <h2 className="text-xl font-bold mb-2">尚未連結資料庫</h2>
                    <p className="text-sm opacity-70 mb-4">請用記事本開啟 <code>index.html</code> 並填入 Firebase 設定。</p>
                </div>
            );

            const [user, setUser] = useState(null);
            const [records, setRecords] = useState([]);
            const [loading, setLoading] = useState(true);
            const [tab, setTab] = useState('calendar'); 
            const [modal, setModal] = useState({ type: null, data: null }); // type: 'add', 'edit', 'settings', 'confirm', 'delete'
            
            const [date, setDate] = useState(new Date());
            const [selDate, setSelDate] = useState(null); 
            const [search, setSearch] = useState('');
            
            const fileRef = useRef(null);

            // 登入與監聽
            useEffect(() => {
                signInAnonymously(auth);
                return onAuthStateChanged(auth, u => { setUser(u); if(!u) setLoading(false); });
            }, []);

            // 資料同步
            useEffect(() => {
                if (!user) return;
                return onSnapshot(collection(db, 'artifacts', appId, 'users', user.uid, 'records'), sn => {
                    const data = sn.docs.map(d => ({ id: d.id, ...d.data() }));
                    data.sort((a, b) => {
                        if (a.date !== b.date) return new Date(b.date) - new Date(a.date);
                        return (a.time || '00:00').localeCompare(b.time || '00:00');
                    });
                    setRecords(data);
                    setLoading(false);
                });
            }, [user]);

            // 計算邏輯
            const calendarData = useMemo(() => {
                const y = date.getFullYear(), m = date.getMonth();
                const days = Array(new Date(y, m, 1).getDay()).fill(null);
                for (let i = 1; i <= new Date(y, m + 1, 0).getDate(); i++) {
                    const dStr = `${y}-${String(m + 1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                    const items = records.filter(r => r.date === dStr).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
                    days.push({ day: i, date: dStr, items });
                }
                return days;
            }, [date, records]);

            const selDayDetails = useMemo(() => selDate ? (calendarData.find(d => d && d.date === selDate) || { date: selDate, items: [] }) : null, [selDate, calendarData]);

            const customers = useMemo(() => {
                const map = {};
                records.forEach(r => {
                    if (r.type !== 'income') return;
                    const k = r.phone || r.name;
                    if (!map[k]) map[k] = { name: r.name, phone: r.phone, visits: 0, late: 0, noshow: 0, total: 0, history: [] };
                    if (r.status === 'normal' || r.status === 'late') { map[k].visits++; map[k].total += Number(r.amount); }
                    if (r.status === 'late') map[k].late++;
                    if (r.status === 'noshow') map[k].noshow++;
                    map[k].history.push(r);
                });
                return Object.values(map).filter(c => c.name.includes(search) || c.phone.includes(search));
            }, [records, search]);

            const stats = useMemo(() => {
                const prefix = date.toISOString().slice(0, 7);
                const monthRecs = records.filter(r => r.date.startsWith(prefix));
                const income = monthRecs.filter(r => r.type === 'income' && (r.status === 'normal' || r.status === 'late')).reduce((s, r) => s + Number(r.amount), 0);
                const expense = monthRecs.filter(r => r.type === 'expense').reduce((s, r) => s + Number(r.amount), 0);
                const projected = monthRecs.filter(r => r.type === 'income' && r.status === 'booked').reduce((s, r) => s + Number(r.amount), 0);
                return { income, expense, projected, balance: income - expense, list: monthRecs };
            }, [records, date]);

            // 操作
            const saveRecord = async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const raw = Object.fromEntries(fd);
                const isEdit = modal.type === 'edit';
                
                // 立即關閉視窗 (Optimistic)
                setModal({ type: null });

                const docData = {
                    type: raw.type, date: raw.date, time: raw.time || '',
                    amount: Number(raw.amount), deposit: Number(raw.deposit || 0),
                    name: raw.name || '', phone: raw.phone || '', serviceItem: raw.serviceItem || '',
                    expenseItem: raw.expenseItem || '', status: raw.status || 'booked',
                    eyeShape: raw.eyeShape || '', createdAt: new Date().toISOString()
                };

                // 清理欄位
                if (raw.type === 'expense') { 
                    delete docData.name; delete docData.phone; delete docData.serviceItem; 
                    delete docData.status; delete docData.deposit; delete docData.time; delete docData.eyeShape;
                } else { delete docData.expenseItem; }

                try {
                    const col = collection(db, 'artifacts', appId, 'users', user.uid, 'records');
                    if (isEdit) await updateDoc(doc(col, modal.data.id), docData);
                    else await addDoc(col, docData);
                } catch(err) { alert("儲存失敗"); console.error(err); }
            };

            const doDelete = async () => {
                const id = modal.data.id;
                setRecords(p => p.filter(r => r.id !== id)); // Optimistic
                setModal({ type: null });
                await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'records', id));
            };

            const doComplete = async () => {
                const id = modal.data.id;
                setRecords(p => p.map(r => r.id === id ? { ...r, status: 'normal' } : r)); // Optimistic
                setModal({ type: null });
                await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'records', id), { status: 'normal' });
            };

            const handleImport = async (e) => {
                const f = e.target.files[0];
                if (!f) return;
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const arr = JSON.parse(ev.target.result);
                        const batch = writeBatch(db);
                        arr.forEach(({id, ...d}) => batch.set(doc(collection(db, 'artifacts', appId, 'users', user.uid, 'records')), d));
                        await batch.commit();
                        alert("匯入成功"); setModal({type:null});
                    } catch { alert("格式錯誤"); }
                };
                reader.readAsText(f);
            };

            const handleExport = () => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([JSON.stringify(records, null, 2)], {type:'application/json'}));
                link.download = `backup-${new Date().toISOString().split('T')[0]}.json`;
                link.click();
            };

            // --- 渲染 ---
            if (loading) return <div className="h-screen flex items-center justify-center text-rose-300"><Loader2 className="animate-spin" /></div>;

            return (
                <div className={`min-h-screen ${THEME.bg} pb-24`}>
                    {/* Header */}
                    <div className="bg-white/80 backdrop-blur-md sticky top-0 z-20 px-4 py-3 flex justify-between items-center border-b border-rose-100 shadow-sm">
                        <div className="flex items-center gap-2 font-bold text-lg text-[#8a4a58]">
                            <div className="w-8 h-8 bg-[#bc6c7e] text-white rounded-lg flex items-center justify-center">12</div>
                            Beauty Studio
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setModal({ type: 'settings' })} className="p-2 text-rose-300 hover:bg-rose-50 rounded-full"><Settings size={20}/></button>
                            <button onClick={() => setModal({ type: 'add' })} className={`${THEME.primary} px-3 py-1.5 rounded-full text-sm font-bold flex items-center gap-1 shadow-md active:scale-95 transition-transform`}><Plus size={16}/> 預約</button>
                        </div>
                    </div>

                    <div className="max-w-md mx-auto p-4 space-y-4">
                        
                        {/* TAB: 月曆 */}
                        {tab === 'calendar' && (
                            <div className="animate-fadeIn space-y-4">
                                <div className="flex justify-between items-center bg-white p-3 rounded-2xl shadow-sm border border-rose-100">
                                    <button onClick={() => setDate(new Date(date.setMonth(date.getMonth()-1)))} className="p-2 text-rose-400"><ChevronLeft/></button>
                                    <h2 className="text-lg font-bold text-[#8a4a58]">{date.getFullYear()} 年 {date.getMonth()+1} 月</h2>
                                    <button onClick={() => setDate(new Date(date.setMonth(date.getMonth()+1)))} className="p-2 text-rose-400"><ChevronRight/></button>
                                </div>
                                <div className="bg-white rounded-2xl shadow-sm border border-rose-100 overflow-hidden">
                                    <div className="grid grid-cols-7 text-center py-2 bg-rose-50/50 text-rose-400 text-xs font-bold">{['日','一','二','三','四','五','六'].map(d=><div key={d}>{d}</div>)}</div>
                                    <div className="grid grid-cols-7 min-h-[300px]">
                                        {calendarData.map((d, i) => !d ? <div key={i} className="bg-white/30 border-b border-r border-rose-50"/> : (
                                            <div key={i} onClick={() => setSelDate(d.date)} className={`min-h-[80px] p-1 border-b border-r border-rose-50 cursor-pointer ${selDate===d.date ? 'bg-rose-100' : 'hover:bg-rose-50'}`}>
                                                <div className="flex justify-between px-1"><span className={`text-[10px] w-5 h-5 flex items-center justify-center rounded-full font-bold ${d.date === new Date().toISOString().split('T')[0] ? 'bg-[#bc6c7e] text-white' : 'text-rose-400'}`}>{d.day}</span>{d.items.some(x=>x.type==='expense') && <div className="w-1.5 h-1.5 bg-rose-300 rounded-full"/>}</div>
                                                <div className="space-y-0.5 mt-1">{d.items.filter(x=>x.type==='income').slice(0,3).map(x => (
                                                    <div key={x.id} className={`text-[9px] truncate px-1 rounded flex gap-1 ${x.status==='booked'?'bg-blue-50 text-blue-600':x.status==='noshow'?'bg-stone-100 text-stone-400 line-through':'bg-emerald-50 text-emerald-600'}`}>
                                                        <span className="opacity-70 font-mono">{x.time}</span>{x.name}
                                                    </div>
                                                ))}
                                                {d.items.filter(x=>x.type==='income').length > 3 && <div className="text-[9px] text-rose-300 px-1">+{d.items.filter(x=>x.type==='income').length-3}</div>}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                {selDayDetails && (
                                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-rose-100 animate-slideUp">
                                        <div className="flex justify-between mb-3"><h3 className="font-bold flex gap-2 text-[#8a4a58]"><CalendarIcon size={18} className="text-rose-400"/> {selDayDetails.date}</h3><button onClick={()=>setSelDate(null)}><X size={16} className="text-rose-300"/></button></div>
                                        {selDayDetails.items.length === 0 ? <p className="text-center text-sm text-rose-300 py-4">本日無安排</p> : 
                                        <div className="space-y-3">{selDayDetails.items.map(it => (
                                            <div key={it.id} className="flex justify-between items-start border-b border-rose-50 pb-3 last:border-0">
                                                <div className="flex gap-3">
                                                    <div className={`mt-1 w-8 h-8 rounded-full flex items-center justify-center shrink-0 ${it.type==='expense'?'bg-rose-100 text-rose-500':it.status==='booked'?'bg-blue-50 text-blue-500':it.status==='noshow'?'bg-stone-100 text-stone-400':'bg-emerald-50 text-emerald-500'}`}>
                                                        {it.type==='expense'?<CreditCard size={14}/>:it.status==='booked'?<CalendarClock size={14}/>:it.status==='noshow'?<XCircle size={14}/>:<Check size={14}/>}
                                                    </div>
                                                    <div>
                                                        <div className="flex items-center gap-2"><span className="font-bold text-sm">{it.type==='income'?it.name:it.expenseItem}</span>{it.time && it.type==='income' && <span className="text-xs bg-rose-50 text-rose-400 px-1 rounded font-mono">{it.time}</span>}</div>
                                                        {it.type==='income' && <div className="text-xs text-gray-500 mt-1 space-y-1"><p>{it.serviceItem}</p><div className="flex gap-2">{it.deposit>0&&<span className="bg-orange-50 text-orange-600 px-1 rounded flex items-center gap-0.5"><Coins size={10}/> 訂 ${it.deposit}</span>}<span className="bg-gray-50 px-1 rounded">{STATUS.find(s=>s.id===it.status)?.label}</span></div></div>}
                                                    </div>
                                                </div>
                                                <div className="text-right space-y-1">
                                                    <p className={`font-mono font-bold ${it.type==='income'?'text-emerald-600':'text-rose-500'}`}>${it.amount}</p>
                                                    {it.type==='income' && it.deposit>0 && <p className="text-[10px] text-gray-400">餘: ${it.amount-it.deposit}</p>}
                                                    <div className="flex justify-end gap-2">
                                                        {it.status==='booked'&&it.type==='income'&&<button onClick={()=>setModal({type:'confirm',data:it})} className="text-emerald-500"><CheckCircle size={16}/></button>}
                                                        <button onClick={()=>setModal({type:'edit',data:it})} className="text-rose-300"><Edit2 size={14}/></button>
                                                        <button onClick={()=>setModal({type:'delete',data:it})} className="text-rose-200"><Trash2 size={14}/></button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}</div>}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TAB: 客戶名單 */}
                        {tab === 'customers' && (
                            <div className="animate-fadeIn space-y-4">
                                <div className="relative"><Search className="absolute left-3 top-2.5 text-rose-300" size={18}/><input type="text" placeholder="搜尋..." value={search} onChange={e=>setSearch(e.target.value)} className="w-full pl-10 pr-4 py-2.5 bg-white border border-rose-200 rounded-xl outline-none focus:ring-2 focus:ring-rose-300"/></div>
                                <div className="space-y-4">
                                    {customers.map((c, i) => (
                                        <div key={i} className="bg-white rounded-2xl shadow-sm border border-rose-100 overflow-hidden">
                                            <div className="p-4 bg-[#f4e3e6] flex justify-between items-center">
                                                <div className="flex items-center gap-3"><div className="w-10 h-10 bg-white rounded-full flex items-center justify-center font-bold text-rose-400 shadow-sm">{c.name[0]}</div><div><h3 className="font-bold text-[#8a4a58]">{c.name}</h3><span className="text-xs text-rose-400 flex items-center gap-1"><Phone size={10}/> {c.phone}</span></div></div>
                                                <div className="text-right"><span className="text-xs text-rose-400">累積消費</span><p className="font-bold text-[#bc6c7e]">${c.total.toLocaleString()}</p></div>
                                            </div>
                                            <div className="grid grid-cols-3 gap-2 p-3 text-center border-b border-rose-50">
                                                <div className="bg-emerald-50 text-emerald-600 p-2 rounded-lg"><p className="text-xs opacity-70">光臨</p><b>{c.visits}</b></div>
                                                <div className="bg-amber-50 text-amber-600 p-2 rounded-lg"><p className="text-xs opacity-70">遲到</p><b>{c.late}</b></div>
                                                <div className="bg-stone-100 text-stone-500 p-2 rounded-lg"><p className="text-xs opacity-70">放鳥</p><b>{c.noshow}</b></div>
                                            </div>
                                            <details className="p-3 bg-rose-50/30 text-sm group">
                                                <summary className="cursor-pointer text-xs text-rose-400 font-bold flex items-center gap-1">歷史紀錄 ({c.history.length}) <ChevronRight size={12} className="group-open:rotate-90 transition-transform"/></summary>
                                                <div className="mt-2 space-y-2 max-h-60 overflow-y-auto">
                                                    {c.history.map(h => (
                                                        <div key={h.id} className="bg-white p-2 rounded border border-rose-100 shadow-sm text-xs">
                                                            <div className="flex justify-between font-bold text-gray-700"><span>{h.date} <span className="bg-rose-50 px-1 rounded font-mono font-normal text-rose-400">{h.time}</span></span><span>${h.amount}</span></div>
                                                            <div className="flex justify-between mt-1 text-gray-500"><span>{h.serviceItem}</span><span className={`px-1 rounded ${h.status==='booked'?'bg-blue-50 text-blue-500':h.status==='noshow'?'bg-stone-100 line-through':''}`}>{STATUS.find(s=>s.id===h.status)?.label}</span></div>
                                                            {h.deposit>0 && <div className="text-orange-500 mt-1 flex gap-1"><Coins size={10}/> 訂 ${h.deposit} (餘 ${h.amount-h.deposit})</div>}
                                                            {h.eyeShape && <div className="mt-1 pt-1 border-t border-rose-50 text-gray-400 flex gap-1"><Eye size={10}/> {h.eyeShape}</div>}
                                                        </div>
                                                    ))}
                                                </div>
                                            </details>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB: 財務 */}
                        {tab === 'finance' && (
                            <div className="animate-fadeIn space-y-4">
                                <div className="flex justify-between items-center bg-white p-3 rounded-2xl shadow-sm border border-rose-100">
                                    <button onClick={() => setDate(new Date(date.setMonth(date.getMonth()-1)))} className="p-2 text-rose-400"><ChevronLeft/></button>
                                    <div className="text-center"><p className="text-xs text-rose-400">財務報表</p><h2 className="text-lg font-bold text-[#8a4a58]">{date.getFullYear()} / {date.getMonth()+1}</h2></div>
                                    <button onClick={() => setDate(new Date(date.setMonth(date.getMonth()+1)))} className="p-2 text-rose-400"><ChevronRight/></button>
                                </div>
                                {stats.projected > 0 && <div className="bg-blue-50 text-blue-600 p-3 rounded-2xl border border-blue-100 flex justify-between font-bold shadow-sm"><span className="flex items-center gap-1 text-sm"><CalendarClock size={16}/> 預估 (預約)</span><span>${stats.projected.toLocaleString()}</span></div>}
                                <div className="grid grid-cols-2 gap-3">
                                    <div className="bg-white p-4 rounded-2xl border-l-4 border-emerald-400 shadow-sm"><p className="text-xs text-gray-400">本月實收</p><p className="text-xl font-bold text-emerald-600">${stats.income.toLocaleString()}</p></div>
                                    <div className="bg-white p-4 rounded-2xl border-l-4 border-rose-400 shadow-sm"><p className="text-xs text-gray-400">本月總支出</p><p className="text-xl font-bold text-rose-500">${stats.expense.toLocaleString()}</p></div>
                                    <div className="col-span-2 bg-[#bc6c7e] text-white p-4 rounded-2xl shadow-sm flex justify-between items-center"><span>本月淨利</span><span className="text-2xl font-bold">${stats.balance.toLocaleString()}</span></div>
                                </div>
                                <div className="bg-white rounded-2xl shadow-sm border border-rose-100 p-2 space-y-2">
                                    {stats.list.map(l => (
                                        <div key={l.id} className="flex justify-between items-center p-2 border-b border-rose-50 last:border-0 text-sm">
                                            <div className="flex gap-3 items-center"><span className="text-rose-300 w-10 text-xs">{l.date.slice(5)}</span><div><p className="font-bold text-gray-700">{l.type==='income'?l.name:l.expenseItem}</p><p className="text-xs text-gray-400">{l.status==='booked'?'預約中':l.status==='noshow'?'已放鳥':''}</p></div></div>
                                            <div className="flex items-center gap-2">
                                                <span className={`font-bold ${l.type==='income'?'text-emerald-600':'text-rose-500'}`}>{l.type==='income'?'+':'-'}${l.amount}</span>
                                                <button onClick={()=>setModal({type:'edit',data:l})} className="text-rose-300"><Edit2 size={12}/></button>
                                                <button onClick={()=>setModal({type:'delete',data:l})} className="text-rose-200"><Trash2 size={12}/></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Nav Bar */}
                    <div className="fixed bottom-0 w-full bg-white/90 backdrop-blur-md border-t border-rose-100 flex justify-around py-2 pb-5 z-30">
                        {[{id:'calendar',icon:CalendarIcon,label:'月曆'},{id:'customers',icon:User,label:'客戶'},{id:'finance',icon:DollarSign,label:'財務'}].map(t => (
                            <button key={t.id} onClick={()=>setTab(t.id)} className={`flex flex-col items-center gap-1 text-xs font-medium transition-colors ${tab===t.id?'text-[#bc6c7e]':'text-rose-200'}`}><t.icon size={24}/>{t.label}</button>
                        ))}
                    </div>

                    {/* --- Modals --- */}
                    
                    {/* Add / Edit Form */}
                    {(modal.type === 'add' || modal.type === 'edit') && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fadeIn backdrop-blur-sm">
                            <div className="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[95vh] overflow-y-auto shadow-2xl p-5 space-y-4">
                                <div className="flex justify-between items-center"><h2 className="font-bold text-lg text-[#8a4a58]">{modal.type==='add'?'新增':'編輯'}</h2><button onClick={()=>setModal({type:null})}><X className="text-rose-300"/></button></div>
                                <form onSubmit={saveRecord} className="space-y-4">
                                    <div className="hidden"><input name="id" defaultValue={modal.data?.id} /></div>
                                    
                                    {/* Type Switcher */}
                                    <div className="bg-rose-50 p-1 rounded-xl flex" x-data="{type:'income'}">
                                        {['income','expense'].map(t => (
                                            <label key={t} className="flex-1 cursor-pointer">
                                                <input type="radio" name="type" value={t} className="peer hidden" defaultChecked={modal.data?.type ? modal.data.type===t : t==='income'} 
                                                    onChange={e=>{ const form = e.target.form; form.querySelectorAll('.income-field').forEach(el=>el.style.display=t==='income'?'block':'none'); form.querySelectorAll('.expense-field').forEach(el=>el.style.display=t==='expense'?'block':'none'); }}
                                                />
                                                <div className="py-2 text-center text-sm font-bold text-rose-300 rounded-lg peer-checked:bg-white peer-checked:text-[#bc6c7e] peer-checked:shadow-sm transition-all">{t==='income'?'客戶服務':'店務支出'}</div>
                                            </label>
                                        ))}
                                    </div>

                                    <div className="flex gap-4">
                                        <div className="flex-1"><label className="text-xs font-bold text-gray-400">日期</label><input type="date" name="date" required defaultValue={modal.data?.date || new Date().toISOString().split('T')[0]} className="w-full p-2 border border-rose-200 rounded-lg bg-white"/></div>
                                        <div className="flex-1 income-field" style={{display: (modal.data?.type||'income')==='income'?'block':'none'}}><label className="text-xs font-bold text-gray-400">時間</label><input type="time" name="time" defaultValue={modal.data?.time || '10:00'} className="w-full p-2 border border-rose-200 rounded-lg bg-white"/></div>
                                    </div>

                                    <div className="income-field" style={{display: (modal.data?.type||'income')==='income'?'block':'none'}}>
                                        <label className="text-xs font-bold text-gray-400">總金額 (含訂)</label>
                                        <input type="number" name="amount" inputMode="numeric" pattern="[0-9]*" placeholder="0" required defaultValue={modal.data?.amount} className="w-full p-2 border border-rose-200 rounded-lg text-lg font-bold bg-white text-gray-700"/>
                                    </div>
                                    <div className="expense-field" style={{display: (modal.data?.type||'income')==='expense'?'block':'none'}}>
                                        <label className="text-xs font-bold text-gray-400">支出金額</label>
                                        <input type="number" name="amount" inputMode="numeric" pattern="[0-9]*" placeholder="0" defaultValue={modal.data?.amount} className="w-full p-2 border border-rose-200 rounded-lg text-lg font-bold bg-white text-gray-700"/>
                                    </div>

                                    <div className="income-field space-y-4" style={{display: (modal.data?.type||'income')==='income'?'block':'none'}}>
                                        <div className="flex gap-4">
                                            <div className="flex-1"><label className="text-xs font-bold text-gray-400">姓名</label><input name="name" required defaultValue={modal.data?.name} placeholder="王小美" className="w-full p-2 border border-rose-200 rounded-lg bg-white"/></div>
                                            <div className="flex-1"><label className="text-xs font-bold text-gray-400">電話</label><input name="phone" type="tel" inputMode="numeric" defaultValue={modal.data?.phone} placeholder="09..." className="w-full p-2 border border-rose-200 rounded-lg bg-white"/></div>
                                        </div>
                                        
                                        <div className="bg-orange-50 p-3 rounded-xl border border-orange-100">
                                            <label className="text-xs font-bold text-orange-600 flex gap-1 items-center"><Coins size={12}/> 訂金 (已收)</label>
                                            <input type="number" name="deposit" inputMode="numeric" pattern="[0-9]*" placeholder="0" defaultValue={modal.data?.deposit} className="w-full p-2 mt-1 border border-orange-200 rounded-lg bg-white"/>
                                        </div>

                                        <div>
                                            <label className="text-xs font-bold text-gray-400">狀態</label>
                                            <div className="grid grid-cols-2 gap-2 mt-1">
                                                {STATUS.map(s => (
                                                    <label key={s.id} className="cursor-pointer">
                                                        <input type="radio" name="status" value={s.id} className="peer hidden" defaultChecked={modal.data?.status ? modal.data.status===s.id : s.id==='booked'}/>
                                                        <div className="py-2 text-xs font-bold text-center border border-rose-100 rounded-lg text-gray-400 peer-checked:bg-white peer-checked:border-rose-300 peer-checked:text-[#bc6c7e] peer-checked:shadow-sm flex items-center justify-center gap-1 transition-all"><s.icon size={12}/> {s.label}</div>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>

                                        <div><label className="text-xs font-bold text-gray-400">項目</label><input name="serviceItem" defaultValue={modal.data?.serviceItem} placeholder="山茶花 400根" className="w-full p-2 border border-rose-200 rounded-lg bg-white"/></div>
                                        <div><label className="text-xs font-bold text-gray-400">備註/眼型</label><textarea name="eyeShape" defaultValue={modal.data?.eyeShape} rows="2" className="w-full p-2 border border-rose-200 rounded-lg bg-white resize-none"/></div>
                                    </div>

                                    <div className="expense-field" style={{display: (modal.data?.type||'income')==='expense'?'block':'none'}}>
                                        <label className="text-xs font-bold text-gray-400">支出說明</label>
                                        <input name="expenseItem" defaultValue={modal.data?.expenseItem} placeholder="房租、材料" className="w-full p-2 border border-rose-200 rounded-lg bg-white"/>
                                    </div>

                                    <button type="submit" className={`w-full py-3 ${THEME.primary} rounded-xl font-bold shadow-lg active:scale-95 transition-transform`}>儲存記錄</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Settings Modal */}
                    {modal.type === 'settings' && (
                        <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-6 backdrop-blur-sm animate-fadeIn">
                            <div className="bg-white w-full max-w-xs rounded-2xl shadow-xl p-6 space-y-4">
                                <h3 className="font-bold text-lg text-[#8a4a58] flex items-center gap-2"><Settings size={20}/> 資料設定</h3>
                                <button onClick={handleExport} className="w-full py-3 bg-rose-50 text-rose-600 rounded-xl font-bold flex items-center justify-center gap-2"><Download size={18}/> 匯出備份</button>
                                <div className="relative">
                                    <input type="file" onChange={handleImport} className="hidden" ref={fileRef} accept=".json"/>
                                    <button onClick={()=>fileRef.current.click()} className="w-full py-3 bg-gray-50 text-gray-600 rounded-xl font-bold flex items-center justify-center gap-2"><Upload size={18}/> 匯入資料</button>
                                </div>
                                <button onClick={()=>setModal({type:null})} className="w-full py-3 text-gray-400">關閉</button>
                            </div>
                        </div>
                    )}

                    {/* Confirm Modal */}
                    {modal.type === 'confirm' && (
                        <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-6 backdrop-blur-sm animate-fadeIn">
                            <div className="bg-white w-full max-w-xs rounded-2xl shadow-xl overflow-hidden text-center">
                                <div className="bg-emerald-500 p-4 text-white"><CheckCircle size={40} className="mx-auto mb-2 opacity-90"/><h3 className="font-bold">確認完工收款？</h3></div>
                                <div className="p-6">
                                    <p className="text-xl font-bold text-gray-800">{modal.data.name}</p>
                                    <p className="text-2xl font-bold text-emerald-600 mt-2">${modal.data.amount}</p>
                                    {modal.data.deposit > 0 && <p className="text-xs text-orange-500 mt-1">尾款: ${modal.data.amount - modal.data.deposit}</p>}
                                </div>
                                <div className="flex border-t"><button onClick={()=>setModal({type:null})} className="flex-1 py-3 text-gray-500">取消</button><button onClick={doComplete} className="flex-1 py-3 bg-emerald-50 text-emerald-600 font-bold border-l">確定</button></div>
                            </div>
                        </div>
                    )}

                    {/* Delete Modal */}
                    {modal.type === 'delete' && (
                        <div className="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-6 backdrop-blur-sm animate-fadeIn">
                            <div className="bg-white w-full max-w-xs rounded-2xl shadow-xl overflow-hidden text-center">
                                <div className="bg-rose-400 p-4 text-white"><AlertTriangle size={40} className="mx-auto mb-2 opacity-90"/><h3 className="font-bold">確定刪除？</h3></div>
                                <div className="p-6"><p className="text-lg font-bold">{modal.data.name||modal.data.expenseItem}</p><p className="text-sm text-gray-400 mt-1">刪除後無法復原</p></div>
                                <div className="flex border-t"><button onClick={()=>setModal({type:null})} className="flex-1 py-3 text-gray-500">取消</button><button onClick={doDelete} className="flex-1 py-3 bg-rose-50 text-rose-500 font-bold border-l">刪除</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
